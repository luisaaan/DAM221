<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Code</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #f5e6d3;
            color: #432818;
            font-family: Arial, sans-serif;
        }
        .container {
            width: min(1000px, calc(100% - 30px));
            margin: 30px auto;
            padding: 30px;
            background-color: #fffaf3;
            border-radius: 18px;
            box-shadow: 0 12px 30px #43281833;
        }
        h1 {
            text-align: center;
            color: #7f3f20;
            margin-bottom: 30px;
        }
        .seccion {
            margin-bottom: 25px;
            padding: 25px;
            background-color: #f3dfc6;
            border-radius: 12px;
        }
        h2 {
            color: #6c4f3d;
        }
        form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        input,
        select {
            padding: 10px;
            border: 1px solid #c9a98c;
            border-radius: 6px;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background-color: #7f3f20;
            color: white;
        }
        button:hover {
            background-color: #5e2f18;
        }
        .editar {
            background-color: #d99d00;
        }
        .eliminar {
            background-color: #b83232;
        }
        .confirmar {
            background-color: #287a3e;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th,
        td {
            padding: 10px;
            border: 1px solid #c9a98c;
            text-align: left;
        }
        th {
            background-color: #6c4f3d;
            color: white;
        }
        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .producto {
            padding: 20px;
            background-color: #fffaf3;
            border-radius: 10px;
            text-align: center;
        }
        .producto h3 {
            margin-top: 0;
            color: #7f3f20;
        }
        .carrito {
            margin-top: 20px;
        }
        .item-carrito {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 12px;
            margin-bottom: 8px;
            background-color: #fffaf3;
            border-radius: 8px;
        }
        .cantidad {
            width: 70px;
        }
        .total {
            font-size: 22px;
            font-weight: bold;
        }
        .pedido {
            padding: 15px;
            margin-bottom: 15px;
            background-color: #fffaf3;
            border-radius: 8px;
        }
        .pedido h3 {
            margin-top: 0;
            color: #7f3f20;
        }
        .mensaje {
            padding: 10px;
            margin-top: 10px;
            background-color: #fffaf3;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Coffee Code</h1>
        <div class="seccion">
            <h2>Productos</h2>
            <form>
                <input type="number" id="id" placeholder="ID del producto">
                <input type="text" id="nombre" placeholder="Nombre">
                <input type="number" step="0.01" id="precio" placeholder="Precio">
                <button type="button" onclick="agregarProducto()">Agregar</button>
                <button type="button" onclick="editarProducto()" class="editar">Editar</button>
            </form>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaProductos"></tbody>
            </table>
        </div>
        <div class="seccion">
            <h2>Menú</h2>
            <div id="menuCliente" class="menu"></div>
        </div>
        <div class="seccion">
            <h2>Productos seleccionados</h2>
            <div id="carrito" class="carrito"></div>
            <p class="total">Total: $<span id="total">0.00</span></p>
            <button type="button" onclick="hacerPedido()" class="confirmar">Hacer pedido</button>
        </div>
        <div class="seccion">
            <h2>Pedidos realizados</h2>
            <div id="listaPedidos"></div>
        </div>
    </div>
    <script src="coffeecode.js"></script>
</body>
</html>
